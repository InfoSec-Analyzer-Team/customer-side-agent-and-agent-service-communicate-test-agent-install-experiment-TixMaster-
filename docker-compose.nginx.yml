# Reverse-proxy nginx in front of the Node backend, so nginx produces a real
# access.log for the XDR agent to tail — replaces the in-process fake logging
# in backend/agent-collector.js.
#
# 使用方式：
#   1. 先啟動 backend：cd backend && npm start   (監聽 :3000)
#   2. docker-compose -f docker-compose.nginx.yml up -d
#   3. 所有流量改走 http://localhost:8080，nginx 會 proxy 到 backend 並寫 access.log
#      （host port 80 留給 log-analysis-prod 的 Gateway nginx，本機同時跑兩套
#      stack 時才不會搶 port；正式環境客戶端只有這一個 nginx，可以用 :80）
#   4. agent/config.yaml 的 source path 指向 ./nginx/logs/access.log（見該檔註解）

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: tixmaster-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
    restart: unless-stopped
    # Docker Desktop (Windows/Mac) resolves host.docker.internal out of the
    # box. Only add `extra_hosts: [host.docker.internal:host-gateway]` back
    # if you move this to native Linux Docker Engine.
