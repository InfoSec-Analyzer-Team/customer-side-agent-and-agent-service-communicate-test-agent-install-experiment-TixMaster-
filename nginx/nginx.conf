events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Local experiment only: trust X-Forwarded-For so generated traffic can
    # vary source IPs across batches. Do not use this trust-all setting in prod.
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # nginx's built-in "combined" format —
    # $remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"
    # matches _COMBINED_RE in agent/parser.py exactly, so no custom log_format is needed.
    access_log /var/log/nginx/access.log combined;

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://host.docker.internal:3000;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
